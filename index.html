<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pete | DJ & Presskit</title>
  <meta name="description" content="Pete — DJ presskit, appearances, bio and bookings.">
  <meta name="theme-color" content="#101010">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0;background:#101010;color:#a8a8a3;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;min-height:100dvh;display:flex;background-image:linear-gradient(180deg,rgba(8,8,8,.2),rgba(8,8,8,.82)),url("https://presskit.pauloconzuelo.chatgpt.site/images/pete-1.webp");background-size:cover;background-position:center}
    main{width:100%;min-height:100vh;min-height:100dvh;padding:max(28px,env(safe-area-inset-top)) 28px max(34px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(190,190,184,.35);padding-bottom:18px}
    .brand{font-size:34px;letter-spacing:-1.5px}
    .genre{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
    section{padding:48px 0 30px;max-width:720px}
    h1{font-size:clamp(72px,22vw,150px);font-weight:400;letter-spacing:-.07em;line-height:.82;margin:0 0 34px;color:#a8a8a3}
    .meta{font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:28px}
    a{display:inline-flex;align-items:center;justify-content:space-between;gap:56px;min-width:min(100%,340px);padding:20px 22px;border:1px solid rgba(190,190,184,.5);border-radius:999px;color:#d0d0ca;text-decoration:none;font-size:18px;background:rgba(15,15,15,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    a:active{background:#d0d0ca;color:#111}
    footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid rgba(190,190,184,.35);padding-top:18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">Pete.</div>
      <div class="genre">Afro / Melodic House</div>
    </header>
    <section>
      <div class="meta">DJ / Electronic Music · BPM 120–125</div>
      <h1>Pete</h1>
      <a href="https://presskit.pauloconzuelo.chatgpt.site/" target="_top" rel="noopener">
        <span>Open Presskit</span><span aria-hidden="true">↗</span>
      </a>
    </section>
    <footer>
      <span>Bio · Appearances · Contact</span>
      <span>Mexico City</span>
    </footer>
  </main>
</body>
</html>
